<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Exact replication of your original CSS specifications */
        body { background: #f8f9fa; font-family: 'Inter', sans-serif; }
        .register-card { border-top: 6px solid #800000; border-radius: 15px; }
        .form-label { font-weight: 600; color: #444; }
        .btn-faculty { background: #800000; color: white; border-radius: 8px; font-weight: bold; }
        .btn-faculty:hover { background: #a00000; transform: translateY(-1px); }
    </style>
    <title>Faculty Registration</title>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card register-card shadow-lg p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold" style="color: #800000;">Faculty Sign Up</h2>
                        <p class="text-muted">Join the VEC Academic Portal</p>
                    </div>
                    <form action="{{ url_for('process_faculty_register') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="fullname" class="form-control" placeholder="Prof. John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="name@vec.edu.in" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select name="role" class="form-select" required>
                                <option value="faculty">Faculty / Professor</option>
                                <option value="admin">Department Head</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-faculty w-100 py-2 mt-3">Register Faculty Account</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('faculty_login_page') }}" class="text-decoration-none">Already have an account? Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
