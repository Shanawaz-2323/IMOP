<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlumNet - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-bg">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="auth-card p-4 shadow-lg" style="max-width: 400px; width: 100%;">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Alumni Login</h2>
                <p class="text-muted">Access your professional network</p>
            </div>
            
            <form action="{{ url_for('verify') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="admin" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-primary w-100 py-2 fw-bold">
                    Secure Login
                </button>
            </form>
            
            <div class="auth-footer text-center mt-4">
                <p class="mb-0">New here? <a href="{{ url_for('register_page') }}" class="text-decoration-none fw-bold">Create Account</a></p>
            </div>
        </div>
    </div>
</body>
</html>
