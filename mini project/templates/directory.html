<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alumni Directory | AlumNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dashboard-body">
    <aside class="sidebar">
    <div class="sidebar-logo text-white p-3">🎓 AlumNet</div>
    <nav class="sidebar-nav mt-4">
        <a href="{{ url_for('dashboard_view') }}">📊 Dashboard</a>
        
        <a href="{{ url_for('view_jobs') }}">💼 Career Options</a>
        
        <a href="{{ url_for('alumni_directory') }}">👥 Alumni Directory</a>
        <hr class="text-white opacity-25">
        <a href="{{ url_for('logout') }}">🚪 Logout</a>
    </nav>
</aside>
    <main class="main-content">
        <header class="directory-header mb-4">
            <h1>Alumni Directory</h1>
            <p>Connect with verified alumni from your network.</p>
        </header>

        <div class="filter-bar row g-3 mb-5">
            <div class="col-md-6">
                <input type="text" class="form-control" placeholder="Search by name or roll number...">
            </div>
            <div class="col-md-3">
                <select class="form-select"><option>Class Year</option></select>
            </div>
            <div class="col-md-3">
                <select class="form-select"><option>Major</option></select>
            </div>
        </div>      

        <div class="container-fluid px-0">
            <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
                {% for person in alumni %}
                <div class="col d-flex justify-content-center">
                    <div class="card alumni-card shadow-sm border-0 h-100">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            
                            <div class="avatar-box">
                                {{ person.fullname[0] | upper }}
                            </div>
                            
                            <h6 class="fw-bold text-dark">{{ person.fullname }}</h6>
                            <p class="text-muted small mb-3">{{ person.rollno }}</p>
                            
                            <span class="status-pill {% if person.status == 'Employed' %}status-employed{% else %}status-seeking{% endif %}">
                                {{ person.status }}
                            </span>
                            
                        </div>
                     </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </main>
</body>
</html>
