<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Portal | Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Maintaining your established Faculty branding */
        body { background: #fdfdfd; font-family: 'Segoe UI', sans-serif; }
        .faculty-auth-card { 
            border-top: 8px solid #800000; 
            border-radius: 15px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        .btn-faculty { 
            background-color: #800000; 
            color: white; 
            border-radius: 8px; 
            font-weight: 600;
            padding: 12px;
            border: none;
        }
        .btn-faculty:hover { background-color: #600000; color: white; transform: translateY(-1px); }
        .domain-notice { font-size: 0.85rem; color: #800000; font-weight: 500; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card faculty-auth-card p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Faculty Sign-In</h2>
                        <p class="text-muted">Academic Administration Portal</p>
                    </div>

                    <form action="{{ url_for('faculty_verify') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" name="email" class="form-control" 
                                   placeholder="username@vec.edu.in" required>
                            <div class="domain-notice mt-1 text-center">
                                * Requires @vec.edu.in domain
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" name="password" class="form-control" 
                                   placeholder="Enter password" required>
                        </div>

                        <button type="submit" class="btn btn-faculty w-100 shadow-sm">
                            Access Faculty Dashboard
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{{ url_for('home') }}" class="text-decoration-none text-muted small">
                            ← Return to Main Portal
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
