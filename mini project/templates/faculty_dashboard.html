<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Workspace | AlumNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Sidebar branding for faculty */
        .faculty-sidebar { background-color: #4a0000 !important; }
        .faculty-sidebar .active { background-color: #800000 !important; border-left: 5px solid white; }
    </style>
</head>
<body class="dashboard-body">

    <aside class="sidebar faculty-sidebar">
        <div class="sidebar-logo text-white p-3">
            🎓 AlumNet Admin<br><span style="font-size: 0.7rem; opacity: 0.7;">FACULTY PORTAL</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="{{ url_for('faculty_dashboard') }}">📊 Dashboard</a>
            <a href="{{ url_for('post_job_page') }}">💼 Job Posting</a>
            <a href="{{ url_for('faculty_alumni_directory') }}">👥 Alumni Directory</a>
            <hr class="text-white opacity-25">
            <a href="{{ url_for('logout') }}">🚪 Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="mb-5 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="fw-bold">Administrative Dashboard</h1>
                <p class="text-muted">Overview of alumni activity and networking.</p>
            </div>
            <div class="date-chip px-3 py-2 bg-white rounded shadow-sm">
                📅 Feb 08, 2026
            </div>
        </header>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card stat-card shadow-sm p-3">
                    <h6 class="text-muted text-uppercase small fw-bold">Total Alumni</h6>
                    <h2 class="fw-bold mb-0">{{ total_alumni }}</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card shadow-sm p-3">
                    <h6 class="text-muted text-uppercase small fw-bold">Active Jobs</h6>
                    <h2 class="fw-bold mb-0 text-success">{{ total_jobs }}</h2>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold mb-4">Quick Management</h5>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('post_job_page') }}" class="btn btn-primary">Post New Job</a>
                    <a href="{{ url_for('alumni_directory') }}" class="btn btn-outline-dark">Review Directory</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
