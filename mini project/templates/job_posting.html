<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job | Faculty Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .faculty-sidebar { background-color: #3d0000 !important; }
        .faculty-sidebar .active { background-color: #800000 !important; border-left: 5px solid white; }
        .job-form-card { border-radius: 15px; border: none; }
        .btn-maroon { background-color: #800000; color: white; font-weight: bold; }
        .btn-maroon:hover { background-color: #600000; color: white; }
    </style>
</head>
<body class="dashboard-body">

    <aside class="sidebar faculty-sidebar">
        <div class="sidebar-logo text-white p-3">🎓 AlumNet Admin</div>
       <nav class="sidebar-nav">
            <a href="{{ url_for('faculty_dashboard') }}">📊 Dashboard</a>
            <a href="{{ url_for('post_job_page') }}">💼 Job Posting</a>
            <a href="{{ url_for('faculty_alumni_directory') }}">👥 Alumni Directory</a>
            <hr class="text-white opacity-25">
            <a href="{{ url_for('logout') }}">🚪 Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="container-fluid">
            <header class="mb-4">
                <h1 class="fw-bold">Create Job Post</h1>
                <p class="text-muted">The post will display the title followed by the description.</p>
            </header>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card job-form-card shadow-sm p-4">
                    <form action="{{ url_for('process_job_post') }}" method="POST">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Job Title</label>
                            <input type="text" name="job_title" class="form-control form-control-lg" 
                                placeholder="e.g. Senior Software Engineer" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Job Description</label>
                            <textarea name="job_description" class="form-control" rows="8" 
                                    placeholder="Enter the full job details..." required></textarea>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="submit" class="btn btn-maroon px-5 py-2">Publish Job Post</button>
                        </div>
                    </form>
                </div>
                
                <div class="col-lg-4">
                    <div class="alert alert-info border-0 shadow-sm">
                        <h5 class="fw-bold">Preview Note</h5>
                        <p class="small mb-0">Once published, the title will appear as a heading, and the description will be formatted directly underneath it for alumni to read.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
