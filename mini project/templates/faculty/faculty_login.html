{% extends "base.html" %}

{% block title %}Faculty Login | VEC Portal{% endblock %}

{% block content %}
<style>
    /* Signature Radial Background */
    body {
        background: radial-gradient(circle at top right, #e0eafc, #f8fafc) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-height: 100vh !important;
        margin: 0 !important;
        overflow: hidden; /* Prevents unnecessary scrolling */
    }

    /* Premium Glass Container */
    .faculty-glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 35px;
        padding: 3rem;
        width: 100%;
        max-width: 430px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.03);
        /* Ensures the card itself doesn't drift */
        margin: auto; 
    }

    /* Distinct Faculty Branding */
    .faculty-brand-icon {
        width: 75px;
        height: 75px;
        background: linear-gradient(135deg, #1a2b48, #0d6efd);
        color: white;
        font-size: 1.8rem;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        box-shadow: 0 10px 25px rgba(26, 43, 72, 0.2);
    }

    /* High-Fidelity Input Fields */
    .faculty-input {
        background: rgba(255, 255, 255, 0.9) !important;
        border: 1px solid #d1d9e6 !important;
        border-radius: 16px !important;
        padding: 1rem 1.25rem !important;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .faculty-input:focus {
        border-color: #1a2b48 !important;
        box-shadow: 0 0 0 4px rgba(26, 43, 72, 0.08) !important;
    }

    /* Authoritative Button Style */
    .btn-faculty-hub {
        background: #1a2b48;
        color: white;
        border: none;
        border-radius: 16px;
        padding: 1rem;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        font-size: 0.85rem;
        transition: all 0.3s ease;
    }

    .btn-faculty-hub:hover {
        background: #0d6efd;
        transform: translateY(-2px);
        box-shadow: 0 12px 20px rgba(13, 110, 253, 0.2);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="faculty-glass-card">
    <div class="text-center">
        <div class="faculty-brand-icon">
            <i class="fas fa-shield-halved"></i>
        </div>
        <h2 class="fw-bold mb-1" style="color: #1a2b48;">Faculty Access</h2>
        <p class="text-muted small mb-4">Admin Portal Gateway</p>
    </div>

    <form action="/faculty_verify" method="POST">
        <div class="mb-3">
            <label class="small fw-bold text-uppercase mb-2 d-block" style="color: #1a2b48; opacity: 0.7;">
                Institutional Email
            </label>
            <input type="email" name="email" class="form-control faculty-input" placeholder="admin@vec.edu" required>
        </div>

        <div class="mb-4">
            <label class="small fw-bold text-uppercase mb-2 d-block" style="color: #1a2b48; opacity: 0.7;">
                Access Key
            </label>
            <input type="password" name="password" class="form-control faculty-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-loading" id="submitBtn">
    <span class="btn-text">Login to Portal</span> 
    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
</button>
    </form>

    <div class="text-center mt-4">
        <a href="/" class="text-decoration-none text-muted small fw-bold" style="letter-spacing: 0.5px;">
            <i class="fas fa-house-user me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
