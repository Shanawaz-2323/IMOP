<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Sign-In | VEC Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-vibrant-bg">
    <div class="auth-container">
        <div class="auth-glass-card">
            <div class="auth-header text-center">
                <div class="auth-icon-circle mx-auto d-flex align-items-center justify-content-center rounded-circle">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h2>Faculty Login</h2>
                <p>Access your portal</p>
            </div>

            <form action="/faculty_verify" method="POST" class="mt-4">
                <div class="input-group-custom mb-3">
                    <label><i class="fas fa-envelope me-2"></i>Email Address</label>
                    <input type="email" name="email" placeholder="admin@example.com" required>
                </div>
                <div class="input-group-custom mb-4">
                    <label><i class="fas fa-lock me-2"></i>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-official-primary w-100">
                    <i class="fas fa-sign-in-alt me-2"></i> Login
                </button>
            </form>

            <div class="auth-footer text-center">
                <a href="/" class="return-link">← Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
