{% extends 'base.html' %}

{% block title %}Post Opportunity | VEC Faculty{% endblock %}

{% block content %}
<style>
/* --- Restored Premium Styling --- */
:root {
    --primary-blue: #1a2b48;
    --accent-blue: #0d6efd;
}

.main-form-container {
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05);
}

.icon-header-box {
    width: 65px;
    height: 65px;
    background: var(--primary-blue);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    font-size: 1.5rem;
    margin: 0 auto;
    box-shadow: 0 10px 20px rgba(26, 43, 72, 0.2);
}

/* Fix for Missing Input Styling */
.input-group-custom {
    display: flex;
    flex-direction: column;
}

.input-group-custom label {
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--primary-blue);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
}

.input-group-custom input, 
.input-group-custom select, 
.input-group-custom textarea {
    background: white;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 12px;
    padding: 12px 16px;
    transition: all 0.3s ease;
    outline: none;
}

.input-group-custom input:focus, 
.input-group-custom textarea:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
}

.btn-submit-premium {
    width: 100%;
    background: var(--primary-blue);
    color: white;
    padding: 16px;
    border-radius: 14px;
    font-weight: 700;
    border: none;
    transition: all 0.3s;
}

.btn-submit-premium:hover {
    background: #000;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
}

.back-link {
    color: var(--primary-blue);
    text-decoration: none;
    font-weight: 700;
}
</style>

<div class="row justify-content-center py-5">
    <div class="col-lg-10 col-xl-8">
        <a href="{{ url_for('faculty_dashboard') }}" class="back-link mb-4 d-inline-block">
            <i class="fas fa-chevron-left me-2"></i> Back to Dashboard
        </a>

        <div class="glass-panel main-form-container p-5">
            <div class="text-center mb-5">
                <div class="icon-header-box mb-3">
                    <i class="fas fa-paper-plane"></i>
                </div>
                <h2 class="fw-bold tracking-tight" style="color: var(--primary-blue);">Create New Opportunity</h2>
                <p class="text-muted">Fill in the professional details to broadcast this role.</p>
            </div>

            <form action="{{ url_for('process_job_post') }}" method="POST" class="custom-form">
                <div class="row g-4">
                    <div class="col-12">
                        <div class="input-group-custom">
                            <label><i class="fas fa-tag me-2"></i>Job Title</label>
                            <input type="text" name="title" placeholder="e.g. Senior Software Engineer" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label><i class="fas fa-building me-2"></i>Company</label>
                            <input type="text" name="company" placeholder="Company Name" required>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label><i class="fas fa-map-marker-alt me-2"></i>Location</label>
                            <input type="text" name="location" placeholder="City, Country" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label><i class="fas fa-clock me-2"></i>Job Type</label>
                            <select name="job_type">
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Internship">Internship</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label><i class="fas fa-wallet me-2"></i>Salary Range</label>
                            <input type="text" name="salary_range" placeholder="e.g. ₹8 - ₹12 LPA">
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="input-group-custom">
                            <label><i class="fas fa-align-left me-2"></i>Description</label>
                            <textarea name="description" rows="4" placeholder="Job description..." required></textarea>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="input-group-custom">
                            <label><i class="fas fa-list-ul me-2"></i>Requirements</label>
                            <textarea name="requirements" rows="3" placeholder="Job requirements..."></textarea>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label><i class="fas fa-envelope me-2"></i>Contact Email</label>
                            <input type="email" name="contact_email" placeholder="hr@company.com">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="input-group-custom">
                            <label><i class="fas fa-calendar-alt me-2"></i>Deadline</label>
                            <input type="date" name="deadline" required>
                        </div>
                    </div>

                    <div class="col-12 mt-5">
                        <button type="submit" class="btn-submit-premium">
                            <i class="fas fa-broadcast-tower me-2"></i> Broadcast Opportunity
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
