<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>Faculty Registration</title>
</head>
<body class="auth-vibrant-bg">
    <div class="reg-page-wrapper">
        <div class="reg-container-wide">
            <div class="reg-glass-card">
                
                <div class="reg-side-panel">
                    <div class="side-content">
                        <i class="fas fa-chalkboard-teacher"></i>
                        <h3>Faculty Portal</h3>
                        <p>Register your official account to manage academic records and connect with the VEC network.</p>
                    </div>
                    <div class="side-footer">
                        <a href="{{ url_for('index') }}" class="btn-glass-outline">
                            <i class="fas fa-arrow-left me-2"></i> Back to Home
                        </a>
                    </div>
                </div>

                <div class="reg-form-panel">
                    <div class="form-header mb-4">
                        <h2>Faculty <span>Registration</span></h2>
                        <p class="text-muted">Enter your professional details below</p>
                    </div>
                    
                    <form method="POST" action="/faculty_register">
                        <div class="reg-grid mb-3">
                            <div class="input-group-custom">
                                <label><i class="fas fa-user me-2"></i>Full Name</label>
                                <input type="text" name="full_name" required placeholder="e.g. Dr. Jane Doe">
                            </div>
                            <div class="input-group-custom">
                                <label><i class="fas fa-envelope me-2"></i>Official Email</label>
                                <input type="email" name="email" required placeholder="name@vec.edu.in">
                            </div>
                        </div>

                        <div class="reg-grid mb-3">
                            <div class="input-group-custom">
                                <label><i class="fas fa-id-badge me-2"></i>Employee ID</label>
                                <input type="text" name="employee_id" required placeholder="VEC-FAC-123">
                            </div>
                            <div class="input-group-custom">
                                <label><i class="fas fa-phone me-2"></i>Phone Number</label>
                                <input type="tel" name="phone" required placeholder="+91 00000 00000">
                            </div>
                        </div>

                        <div class="reg-grid mb-3">
                            <div class="input-group-custom">
                                <label><i class="fas fa-building me-2"></i>Department</label>
                                <select name="department" required>
                                    <option value="">Select Department</option>
                                    <option value="CSE">Computer Science</option>
                                    <option value="ECE">Electronics & Communication</option>
                                    <option value="MECH">Mechanical Engineering</option>
                                    <option value="IT">Information Technology</option>
                                </select>
                            </div>
                            <div class="input-group-custom">
                                <label><i class="fas fa-briefcase me-2"></i>Designation</label>
                                <input type="text" name="designation" required placeholder="Assistant Professor">
                            </div>
                        </div>

                        <div class="security-section-glass mb-4">
                            <div class="input-group-custom mb-3">
                                <label><i class="fas fa-shield-alt me-2"></i>Security Question (for recovery)</label>
                                <select name="security_question" required>
                                    <option value="">Select a question</option>
                                    <option value="first_pet">What was the name of your first pet?</option>
                                    <option value="birth_city">What city were you born in?</option>
                                    <option value="favorite_book">What is your favorite book?</option>
                                </select>
                            </div>
                            <div class="input-group-custom">
                                <label><i class="fas fa-key me-2"></i>Security Answer</label>
                                <input type="text" name="security_answer" required placeholder="Your answer">
                            </div>
                        </div>

                        <div class="reg-grid mb-4">
                            <div class="input-group-custom">
                                <label><i class="fas fa-lock me-2"></i>Password</label>
                                <input type="password" name="password" required placeholder="••••••••">
                            </div>
                            <div class="input-group-custom">
                                <label><i class="fas fa-lock me-2"></i>Confirm Password</label>
                                <input type="password" name="confirm_password" required placeholder="••••••••">
                            </div>
                        </div>

                        <button type="submit" class="btn-official-primary w-100">
                            Create Faculty Account <i class="fas fa-user-plus ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
