<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Home | AlumNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .faculty-hero-bg {
            background: linear-gradient(rgba(128, 0, 0, 0.85), rgba(44, 62, 80, 0.9)), 
                        url('https://images.unsplash.com/photo-1523050853064-90ff001f391a?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            height: 100vh;
            color: white;
        }
        .btn-faculty-main {
            background-color: #800000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 30px;
            transition: 0.3s;
        }
        .btn-faculty-main:hover { background-color: #a00000; transform: scale(1.05); color: white; }
    </style>
</head>
<body>
    <div class="faculty-hero-bg d-flex align-items-center justify-content-center text-center">
        <div class="container">
            <div class="logo-large mb-4" style="font-size: 3rem;">🎓</div>
            <h1 class="display-3 fw-bold mb-3">Faculty Portal</h1>
            <p class="lead mb-5 fs-4">Welcome, Professor. Manage your alumni network and post career opportunities.</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('faculty_dashboard') }}" class="btn btn-faculty-main shadow">Go to Dashboard</a>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light rounded-pill px-4">Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
