<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Restoring your exact CSS specifications */
        :root {
            --alumni-blue: #2c3e50;
            --faculty-maroon: #800000;
            --bg-light: #f4f7f6;
        }
        body { background-color: var(--bg-light); font-family: 'Segoe UI', sans-serif; }
        .main-card { border-radius: 20px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        /* Button Styles to match your detail requirements */
        .btn-alumni { background-color: var(--alumni-blue); color: white; border: none; padding: 12px; }
        .btn-alumni:hover { background-color: #1a252f; color: white; }
        
        .btn-faculty { background-color: var(--faculty-maroon); color: white; border: none; padding: 12px; }
        .btn-faculty:hover { background-color: #600000; color: white; }
    </style>
    <title>VEC Portal Home</title>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card main-card p-5 text-center bg-white">
                    <h1 class="fw-bold mb-2">VEC Trusted Portal</h1>
                    <p class="text-muted mb-5">Select your gateway to continue</p>

                    <div class="d-grid gap-3">
                        <a href="{{ url_for('alumni_login_page') }}" class="btn btn-alumni btn-lg shadow-sm">
                            🎓 Alumni Login
                        </a>

                        <a href="{{ url_for('faculty_login_page') }}" class="btn btn-faculty btn-lg shadow-sm">
                            👨‍🏫 Faculty Login
                        </a>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between">
                            <small>New Alumnus? <a href="{{ url_for('register_page') }}">Register</a></small>
                            <small>New Faculty? <a href="{{ url_for('faculty_register_page') }}">Join Portal</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
