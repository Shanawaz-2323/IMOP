{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row mb-5 align-items-center">
        <div class="col-lg-6">
            <h2 class="fw-800 text-dark mb-1">Alumni Directory</h2>
            <p class="text-muted">Connect with verified alumni from your professional network.</p>
        </div>
        <div class="col-lg-6">
            <div class="glass-panel p-2 shadow-sm d-flex gap-2" style="border-radius: 50px; background: white;">
                <input type="text" class="form-control border-0 bg-transparent ps-4" placeholder="Search by name or roll number...">
                <button class="btn btn-primary rounded-circle" style="width: 45px; height: 45px;">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        {% for person in alumni %}
        <div class="col-md-6 col-lg-4 col-xl-3">
            <div class="glass-panel p-4 h-100 text-center border-0 shadow-sm animate-pop" style="border-radius: 25px; background: white;">
                <div class="avatar-lg bg-soft-primary text-primary rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 70px; height: 70px; font-size: 1.5rem; font-weight: 800;">
                    {{ person.fullname[0] | upper }}
                </div>

                <h5 class="fw-bold text-dark mb-1">{{ person.fullname }}</h5>
                <p class="text-muted small mb-3">{{ person.rollno }}</p>

                <div class="mb-4">
                    <span class="badge rounded-pill px-3 py-2 
                        {% if person.status == 'Employed' %}bg-success-soft text-success
                        {% elif person.status == 'Higher Studies' %}bg-info-soft text-info
                        {% else %}bg-secondary-soft text-secondary{% endif %}">
                        {{ person.status }}
                    </span>
                </div>

               <a href="{{ url_for('view_member_profile', rollno=person.rollno) }}" 
                class="btn btn-light rounded-pill w-100 fw-bold mt-3">
                    View Profile
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .bg-soft-primary { background-color: rgba(13, 110, 253, 0.1); }
    .bg-success-soft { background-color: rgba(25, 135, 84, 0.1); }
    .bg-info-soft { background-color: rgba(13, 202, 240, 0.1); }
    .bg-secondary-soft { background-color: rgba(108, 117, 125, 0.1); }
    .animate-pop:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 25px rgba(0,0,0,0.08) !important;
    }
</style>
{% endblock %}
