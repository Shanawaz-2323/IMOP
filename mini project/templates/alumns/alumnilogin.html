{% extends "base.html" %}

{% block title %}Alumni Login | VEC Portal{% endblock %}

{% block content %}
<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }
    .glass-login-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(15px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        width: 100%;
        max-width: 420px;
        padding: 40px;
        transition: transform 0.3s ease;
    }
    .glass-login-card:hover {
        transform: translateY(-5px);
    }
    .login-icon {
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #1a2b48, #0d6efd);
        color: white;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 1.8rem;
        box-shadow: 0 10px 20px rgba(13, 110, 253, 0.2);
    }
    .form-control-premium {
        background: rgba(248, 250, 252, 0.8);
        border: 2px solid transparent;
        border-radius: 12px;
        padding: 12px 15px;
        transition: all 0.3s ease;
    }
    .form-control-premium:focus {
        background: white;
        border-color: var(--v-accent);
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        outline: none;
    }
    .btn-login {
        background: var(--primary-blue);
        color: white;
        border-radius: 12px;
        padding: 12px;
        font-weight: 700;
        border: none;
        margin-top: 10px;
        transition: all 0.3s ease;
    }
    .btn-login:hover {
        background: #0d1b31;
        transform: scale(1.02);
        box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }
</style>

<div class="login-container">
    <div class="glass-login-card animate-pop">
        <div class="login-icon">
            <i class="fas fa-user-graduate"></i>
        </div>
        
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Alumni Portal</h3>
            <p class="text-muted small">Sign in to access the VEC network</p>
        </div>

        <form action="{{ url_for('verify') }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase opacity-75">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control form-control-premium" placeholder="Your username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase opacity-75">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control form-control-premium" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-login">
                    Verify Identity <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-0">Don't have an account? 
                <a href="{{ url_for('register_page') }}" class="text-primary fw-bold text-decoration-none">Register</a>
            </p>
        </div>
    </div>
    <a href="{{ url_for('index') }}" class="back-home-btn">
    <i class="fas fa-arrow-left me-2"></i> Back to Home
</a>

<style>
    .back-home-btn {
        position: fixed;
        top: 30px;
        left: 30px;
        text-decoration: none;
        color: var(--primary-blue);
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        padding: 10px 20px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 0.85rem;
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        z-index: 1001; /* Above everything */
    }
    .back-home-btn:hover {
        background: white;
        transform: translateX(-5px);
        color: var(--v-accent);
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
</style>
</div>
{% endblock %}
